# workspace / kalibrace / limity
teleop:
  control_rate_hz: 30          # jak často posíláme příkaz do simulace/robota
  max_joint_speed: 0.5         # rad/s - bezpečnostní limit
  joint_limits_deg:
    shoulder_pitch: [-90, 90]
    shoulder_yaw:   [-90, 90]
    elbow_pitch:    [0, 135]
    wrist_pitch:    [-90, 90]
    wrist_yaw:      [-90, 90]
  grip_limit: [0.0, 1.0]       # 0.0 = otevřená ruka, 1.0 = plně sevřená
