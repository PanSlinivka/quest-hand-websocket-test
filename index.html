<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Quest Hand → WebSocket v1.4</title>
    <meta name="xr-compatible" content="true" />
    <style>
      body { font-family: sans-serif; text-align: center; padding: 20px; }
      #status { font-weight: bold; color: #0066cc; }
      #log {
        text-align: left;
        margin: 20px auto;
        width: 90%;
        background: #f9f9f9;
        border: 1px solid #ccc;
        border-radius: 6px;
        padding: 10px;
        height: 250px;
        overflow-y: auto;
        font-size: 13px;
        white-space: pre-wrap;
      }
      button {
        margin-top: 10px;
        padding: 10px 20px;
        border: none;
        background: #007bff;
        color: white;
        border-radius: 6px;
        font-size: 16px;
      }
      button:hover { background: #0056b3; }
    </style>
  </head>

  <body>
    <h2>Quest Hand → WebSocket</h2>
    <p>Status: <span id="status">Disconnected</span></p>
    <p style="font-size:14px; color:gray;">Version: v1.4 (2025-10-29-00:45)</p>
    <input id="ip" type="text" value="wss://contain-current-stack-powerseller.trycloudflare.com" style="width:400px;" />
    <button id="connect">Connect + Start XR</button>

    <div id="log">🕶️ Ready – open this page in Meta Browser on Quest.<br /></div>

    <script>
      const VERSION = "v1.4";
      let ws, xrSession, referenceSpace;

      function log(msg, color = "black") {
        const el = document.getElementById("log");
        const line = document.createElement("div");
        line.innerHTML = msg;
        line.style.color = color;
        el.appendChild(line);
        el.scrollTop = el.scrollHeight;
      }

      async function initXR() {
        if (!navigator.xr) {
          log("❌ WebXR not supported or not allowed. Open this in Meta Browser on Quest.", "red");
          return;
        }

        try {
          log("🔍 Checking XR support...");
          const supported = await navigator.xr.isSessionSupported("immersive-vr");
          if (!supported) {
            log("⚠️ immersive-vr not supported on this device/browser.", "orange");
            return;
          }

          log("🎯 Requesting XR session...");
          xrSession = await navigator.xr.requestSession("immersive-vr", {
            optionalFeatures: ["hand-tracking", "local-floor"],
          });

          referenceSpace = await xrSession.requestReferenceSpace("local-floor");
          document.getElementById("status").innerText = "XR active ✅";
          log("✅ XR session started!");
          xrSession.requestAnimationFrame(onXRFrame);
        } catch (err) {
          log("❌ Failed to start XR: " + err.message, "red");
        }
      }

      function sendHandData(frame) {
        if (!ws || ws.readyState !== WebSocket.OPEN || !xrSession) return;
        const hands = [];
        for (const inputSource of xrSession.inputSources) {
          if (inputSource.hand) {
            const handData = {};
            for (const [jointName, jointSpace] of inputSource.hand.entries()) {
              const pose = frame.getJointPose(jointSpace, referenceSpace);
              if (pose) {
                handData[jointName] = [
                  pose.transform.position.x,
                  pose.transform.position.y,
                  pose.transform.position.z,
                ];
              }
            }
            hands.push({ hand: inputSource.handedness, joints: handData });
          }
        }
        if (hands.length > 0) ws.send(JSON.stringify({ ...hands[0], version: VERSION }));
      }

      function onXRFrame(t, frame) {
        sendHandData(frame);
        xrSession.requestAnimationFrame(onXRFrame);
      }

      document.getElementById("connect").addEventListener("click", () => {
        let ip = document.getElementById("ip").value.trim();

        if (!/^wss?:\/\//i.test(ip)) {
          log("⚠️ Invalid WebSocket address. Must start with ws:// or wss://", "orange");
          return;
        }

        log("🔌 Connecting to " + ip + " ...", "blue");
        try {
          ws = new WebSocket(ip);
        } catch (e) {
          log("❌ Exception when creating socket: " + e.message, "red");
          return;
        }

        ws.onopen = () => {
          document.getElementById("status").innerText = "Connected ✅";
          log("✅ WebSocket connected! Starting XR session...", "green");
          initXR();
        };

        ws.onerror = (e) => {
          document.getElementById("status").innerText = "Error ❌";
          log("❌ WebSocket error: " + (e.message || "Unknown error"), "red");
        };

        ws.onclose = () => {
          document.getElementById("status").innerText = "Disconnected";
          log("🔌 WebSocket connection closed.", "gray");
        };
      });
    </script>
  </body>
</html>
