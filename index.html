<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Quest 3 → WebSocket (hand tracking)</title>
  </head>
  <body style="font-family:sans-serif; text-align:center;">
    <h2>Quest Hand → WebSocket</h2>
    <p>Status: <span id="status">Disconnected</span></p>
    <input id="ip" type="text" value="ws://192.168.0.228:8765" style="width:300px;" />
    <button id="connect">Connect</button>

    <script>
      let ws;
      let xrSession = null;
      let referenceSpace = null;

      async function initXR() {
        try {
          if (!navigator.xr) {
            alert("WebXR not supported.");
            return;
          }

          const supported = await navigator.xr.isSessionSupported("immersive-vr");
          if (!supported) {
            alert("immersive-vr not supported on this device/browser");
            return;
          }

          xrSession = await navigator.xr.requestSession("immersive-vr", {
            optionalFeatures: ["hand-tracking", "local-floor"],
          });

          referenceSpace = await xrSession.requestReferenceSpace("local-floor");
          xrSession.addEventListener("end", () => {
            document.getElementById("status").innerText = "Session ended";
          });

          xrSession.requestAnimationFrame(onXRFrame);
        } catch (err) {
          console.error(err);
          alert("Failed to start WebXR: " + err.message);
        }
      }

      function sendHandData(frame) {
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        const hands = [];

        for (const inputSource of xrSession.inputSources) {
          if (inputSource.hand) {
            const handData = {};
            for (const [jointName, jointSpace] of inputSource.hand.entries()) {
              const pose = frame.getJointPose(jointSpace, referenceSpace);
              if (pose) {
                handData[jointName] = [
                  pose.transform.position.x,
                  pose.transform.position.y,
                  pose.transform.position.z,
                ];
              }
            }
            hands.push({ hand: inputSource.handedness, joints: handData });
          }
        }

        if (hands.length > 0) ws.send(JSON.stringify(hands[0]));
      }

      function onXRFrame(t, frame) {
        sendHandData(frame);
        xrSession.requestAnimationFrame(onXRFrame);
      }

      document.getElementById("connect").addEventListener("click", () => {
        const ip = document.getElementById("ip").value;
        ws = new WebSocket(ip);

        ws.onopen = () => {
          document.getElementById("status").innerText = "Connected ✅";
          initXR();
        };
        ws.onerror = (e) => {
          document.getElementById("status").innerText = "Connection error ❌";
          console.error(e);
        };
        ws.onclose = () => {
          document.getElementById("status").innerText = "Disconnected";
        };
      });
    </script>
  </body>
</html>
